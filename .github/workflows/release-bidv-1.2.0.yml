name: Publish BIDV v1.2.0

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-bidv-1.2.0.yml']

concurrency:
  group: family-organizer-v1.2.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'tanka420/Family-Organizer'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish the tested BIDV release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.2.0
          TARGET: d780ea64ef2abc8a18c22372a8ddbd69c2dc5626
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$TARGET" HEAD
          test "$(git show "$TARGET:package.json" | jq -er .version)" = "${TAG#v}"

          if existing_target=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}"); then
            test "$existing_target" = "$TARGET"
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "${existing_target:-}" = "$TARGET"
            test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
            exit 0
          fi

          notes=$(mktemp)
          git show "$TARGET:CHANGELOG.md" | awk -v heading="## [${TAG#v}]" '
            index($0, heading) == 1 { in_release = 1; next }
            in_release && /^## / { exit }
            in_release { print }
          ' > "$notes"
          test -s "$notes"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$TARGET" \
            --title "$TAG" --notes-file "$notes" --latest
